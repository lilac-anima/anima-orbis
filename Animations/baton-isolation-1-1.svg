<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -100 800 700" role="img" aria-labelledby="title desc">
  <title id="title">Baton isolation 1:1</title>
  <desc id="desc">The baton rotates clockwise around its midpoint while the midpoint rotates clockwise around the origin at the same frequency.</desc>
  <rect x="0" y="-100" width="800" height="700" rx="20" fill="#191c20"/>
  <g stroke="#2a2f35" stroke-width="1"><path d="M400 28V472M28 250H772"/></g>
  <!-- The midpoint orbit and the outer endpoint’s resulting path. -->
  <circle cx="400" cy="250" r="145" fill="none" stroke="#343a41" stroke-width="1" stroke-dasharray="3 7"/>
  <circle cx="400" cy="250" r="290" fill="none" stroke="#e8b66a" stroke-width="5" opacity=".18"/>
  <circle cx="400" cy="250" r="290" fill="none" stroke="#e8b66a" stroke-width="1" stroke-dasharray="2 8" opacity=".55"/>
  <!-- One end remains at the origin; the other traces the outer circle. -->
  <circle cx="400" cy="250" r="8" fill="#8dc7c4" opacity=".28"/>
  <circle cx="400" cy="250" r="4" fill="#8dc7c4"/>
  <path d="M400 250 A36 36 0 0 1 425 281" fill="none" stroke="#8dc7c477" stroke-width="2"/>
  <path d="M425 281l-7-4 7-4z" fill="#8dc7c4"/>
  <text x="414" y="274" fill="#8e98a3" font-family="system-ui,sans-serif" font-size="12">origin axis</text>
  <g transform="translate(400 250)">
    <!-- Midpoint: one clockwise orbit around the origin. -->
    <g>
      <animateMotion path="M 145 0 A 145 145 0 1 1 -145 0 A 145 145 0 1 1 145 0" dur="6s" rotate="0" calcMode="paced" repeatCount="indefinite"/>
      <!-- Baton: one clockwise rotation around its midpoint. -->
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="6s" repeatCount="indefinite"/>
        <line x1="-145" y1="4" x2="145" y2="4" stroke="#0008" stroke-width="18" stroke-linecap="round"/>
        <line x1="-145" y1="0" x2="145" y2="0" stroke="#e8b66a" stroke-width="13" stroke-linecap="round"/>
        <line x1="-138" y1="-3" x2="138" y2="-3" stroke="#fff8df99" stroke-width="3" stroke-linecap="round"/>
        <circle cx="-145" cy="0" r="8" fill="#f5f0df"/><circle cx="145" cy="0" r="8" fill="#f5f0df"/>
        <circle cx="-145" cy="0" r="3" fill="#69747d"/><circle cx="145" cy="0" r="3" fill="#69747d"/>
        <circle cx="0" cy="0" r="10" fill="#f5f0df"/><circle cx="0" cy="0" r="4" fill="#69747d"/>
        <text x="14" y="-15" fill="#8e98a3" font-family="system-ui,sans-serif" font-size="12">midpoint axis</text>
      </g>
    </g>
  </g>
</svg>