<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="title desc">
  <title id="title">Baton reel</title>
  <desc id="desc">A baton rotating clockwise around its midpoint in the wall plane.</desc>
  <rect width="800" height="500" rx="20" fill="#191c20"/>
  <g stroke="#2a2f35" stroke-width="1">
    <path d="M400 28V472M28 250H772"/>
  </g>
  <circle cx="400" cy="250" r="145" fill="none" stroke="#343a41" stroke-width="1" stroke-dasharray="3 7"/>
  <path d="M400 250 A23 23 0 0 1 421 271" fill="none" stroke="#f4e6c477" stroke-width="2"/>
  <path d="M421 271l-8-2 5-7z" fill="#f4e6c4"/>
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 400 250" to="360 400 250" dur="2s" repeatCount="indefinite"/>
    <line x1="255" y1="254" x2="545" y2="254" stroke="#0008" stroke-width="18" stroke-linecap="round"/>
    <line x1="255" y1="250" x2="545" y2="250" stroke="#e8b66a" stroke-width="13" stroke-linecap="round"/>
    <line x1="262" y1="247" x2="538" y2="247" stroke="#fff8df99" stroke-width="3" stroke-linecap="round"/>
    <circle cx="255" cy="250" r="8" fill="#f5f0df"/>
    <circle cx="545" cy="250" r="8" fill="#f5f0df"/>
    <circle cx="255" cy="250" r="3" fill="#69747d"/>
    <circle cx="545" cy="250" r="3" fill="#69747d"/>
  </g>
  <circle cx="400" cy="250" r="4" fill="#f4e6c4"/>
</svg>
