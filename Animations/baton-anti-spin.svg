<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -100 800 700" role="img" aria-labelledby="title desc">
  <title id="title">Baton anti-spin</title>
  <desc id="desc">A baton spins clockwise around its midpoint while that midpoint travels counter clockwise around the origin.</desc>
  <rect x="0" y="-100" width="800" height="700" rx="20" fill="#191c20"/>
  <g stroke="#2a2f35" stroke-width="1">
    <path d="M400 28V472M28 250H772"/>
  </g>
  <!-- The midpoint travels on this counter-clockwise orbit around the origin. -->
  <circle cx="400" cy="250" r="145" fill="none" stroke="#343a41" stroke-width="1" stroke-dasharray="3 7"/>
  <circle cx="400" cy="250" r="5" fill="#8dc7c4"/>
  <path d="M400 250 A36 36 0 0 0 375 219" fill="none" stroke="#8dc7c477" stroke-width="2"/>
  <path d="M375 219l8 1-5 7z" fill="#8dc7c4"/>
  <!-- Endpoint trails: with equal opposing rates, the ends trace perpendicular lines. -->
  <path d="M110 250 H690" fill="none" stroke="#e8b66a" stroke-width="5" stroke-linecap="round" opacity=".18"/>
  <path d="M400 -40 V540" fill="none" stroke="#8dc7c4" stroke-width="5" stroke-linecap="round" opacity=".18"/>
  <path d="M110 250 H690" fill="none" stroke="#e8b66a" stroke-width="1" stroke-dasharray="2 8" opacity=".55"/>
  <path d="M400 -40 V540" fill="none" stroke="#8dc7c4" stroke-width="1" stroke-dasharray="2 8" opacity=".55"/>
  <text x="414" y="274" fill="#8e98a3" font-family="system-ui,sans-serif" font-size="12">origin axis</text>
  <!-- Midpoint motion: counter-clockwise around the origin, without carrying the baton’s angle. -->
  <g transform="translate(400 250)">
    <g>
      <animateMotion
        path="M 145 0 A 145 145 0 1 0 -145 0 A 145 145 0 1 0 145 0"
        dur="6s" rotate="0" calcMode="paced" repeatCount="indefinite"/>
      <!-- Baton motion: clockwise around its midpoint, one full turn per orbit. -->
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="6s" repeatCount="indefinite"/>
        <line x1="-145" y1="4" x2="145" y2="4" stroke="#0008" stroke-width="18" stroke-linecap="round"/>
        <line x1="-145" y1="0" x2="145" y2="0" stroke="#e8b66a" stroke-width="13" stroke-linecap="round"/>
        <line x1="-138" y1="-3" x2="138" y2="-3" stroke="#fff8df99" stroke-width="3" stroke-linecap="round"/>
        <circle cx="-145" cy="0" r="8" fill="#f5f0df"/>
        <circle cx="145" cy="0" r="8" fill="#f5f0df"/>
        <circle cx="-145" cy="0" r="3" fill="#69747d"/>
        <circle cx="145" cy="0" r="3" fill="#69747d"/>
        <circle cx="0" cy="0" r="10" fill="#f5f0df"/>
        <circle cx="0" cy="0" r="4" fill="#69747d"/>
        <text x="14" y="-15" fill="#8e98a3" font-family="system-ui,sans-serif" font-size="12">midpoint axis</text>
      </g>
    </g>
  </g>
</svg>
