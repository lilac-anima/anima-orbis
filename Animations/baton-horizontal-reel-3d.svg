<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="title desc">
  <title id="title">Baton horizontal-plane reel, 3D view</title>
  <desc id="desc">A baton starts with one end at the origin and extends along the positive x-axis, then reels clockwise around its midpoint in a horizontal plane.</desc>
  <rect width="800" height="500" rx="20" fill="#191c20"/>
  <defs>
    <linearGradient id="plane" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#293139" stop-opacity=".52"/><stop offset="1" stop-color="#15181c" stop-opacity=".1"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <!-- Oblique projection of the horizontal plane. -->
  <ellipse cx="400" cy="250" rx="350" ry="158" fill="url(#plane)" stroke="#38424b" stroke-width="1"/>
  <g stroke="#303940" stroke-width="1" opacity=".75">
    <path d="M50 250H750M400 92V408"/>
    <ellipse cx="400" cy="250" rx="220" ry="99" fill="none" stroke-dasharray="3 8"/>
    <ellipse cx="400" cy="250" rx="110" ry="49" fill="none" stroke-dasharray="3 8"/>
  </g>
  <text x="70" y="115" fill="#8e98a3" font-family="system-ui,sans-serif" font-size="12" letter-spacing="1.4">HORIZONTAL PLANE · 3D VIEW</text>
  <text x="414" y="274" fill="#8dc7c4" font-family="system-ui,sans-serif" font-size="12">origin</text>
  <circle cx="400" cy="250" r="5" fill="#8dc7c4"/>
  <!-- Midpoint and the projected circular path of each end. -->
  <ellipse cx="545" cy="250" rx="145" ry="65.25" fill="none" stroke="#e8b66a" stroke-width="4" opacity=".18"/>
  <ellipse cx="545" cy="250" rx="145" ry="65.25" fill="none" stroke="#e8b66a" stroke-width="1" stroke-dasharray="2 8" opacity=".7"/>
  <path d="M400 250 A30 14 0 0 1 427 258" fill="none" stroke="#e8b66a" stroke-width="2" opacity=".9"/>
  <path d="M427 258l-8-1 4-6z" fill="#e8b66a"/>
  <circle cx="545" cy="250" r="7" fill="#f4e6c4" filter="url(#glow)"/>
  <text x="560" y="244" fill="#8e98a3" font-family="system-ui,sans-serif" font-size="12">midpoint axis</text>
